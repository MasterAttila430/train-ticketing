<div class="login-wrapper">
  <h2>Train Ticketing Login</h2>

  <input type="text" [(ngModel)]="username" placeholder="Username" /><br>
  <input type="email" [(ngModel)]="email" placeholder="Your email (for booking confirmations)" /><br>

  <select [(ngModel)]="role">
    <option value="customer">Customer</option>
    <option value="admin">Administrator</option>
  </select><br>

  <div *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</div>

  <button class="login-btn" (click)="onLogin()">Login</button>
</div>
