<div class="login-wrapper">
  <h2>Welcome to Train Ticketing</h2>
  <p>Please select your profile to enter the application.</p>

  <select [(ngModel)]="role" (change)="errorMsg=''">
    <option value="customer">Customer (Book Tickets)</option>
    <option value="admin">Administrator (Manage System)</option>
  </select><br>

  <input type="text" [(ngModel)]="username" placeholder="Your Name" /><br>

  <input type="email" *ngIf="role === 'customer'"
         [(ngModel)]="email" placeholder="Your Email (for notifications)" /><br>

  <div *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</div>

  <button class="login-btn" (click)="onLogin()">Enter Application</button>
</div>
